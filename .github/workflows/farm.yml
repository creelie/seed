name: farm

# Certificate farm for the depth bound in dimension four (code/certify).  A push that changes
# code/certify/queue.json starts a run: every reflexive 4-polytope of the Kreuzer-Skarke list whose
# pair bound exceeds T is given a chain of cuts of total bound at most T, or is reported.  Each job
# reads its row groups of the Hugging Face copy of the list and keeps the certificates and a
# summary as an artifact; the last job merges the summaries into code/certify/results/<tag>.

on:
  push:
    paths: ["code/certify/queue.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
      T: ${{ steps.p.outputs.T }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: python3 code/certify/farm_plan.py >> "$GITHUB_OUTPUT"
  shard:
    needs: plan
    name: Job ${{ matrix.j.k }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # at most 12 runners at a time, so that the other repositories of the account keep
      # runners for their own checks
      max-parallel: 12
      matrix:
        j: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy, pyarrow and fsspec
        run: python3 -m pip install -q numpy pyarrow fsspec aiohttp
      - name: Build PALP
        run: |
          curl -sSfL --retry 5 -o palp.tar.gz https://hep.itp.tuwien.ac.at/~kreuzer/CY/palp/palp-2.21.tar.gz
          echo "7e4a7bf219998a844c0bcce0a176e49d0743cb4b505a0e195329bf2ec196ddd7  palp.tar.gz" | sha256sum -c
          tar xzf palp.tar.gz
          make -C palp-2.21 poly.x > /dev/null
          echo "PALP=$PWD/palp-2.21/poly.x" >> "$GITHUB_ENV"
      - name: Certify
        run: |
          timeout 335m python3 code/certify/farm_shard.py "${{ matrix.j.g }}" "${{ needs.plan.outputs.T }}" "$(nproc)" 19500 out
      - name: Keep the certificates and the summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.tag }}-${{ matrix.j.k }}
          path: out/
          retention-days: 90
  merge:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.plan.outputs.tag }}-*
          path: art
      - name: Merge the summaries
        run: python3 code/certify/farm_merge.py art "code/certify/results/${{ needs.plan.outputs.tag }}"
      - name: Commit the merged summary
        run: |
          git config user.name "Deep Bhattacharjee"
          git config user.email "itsdeep@live.com"
          git add code/certify/results
          git commit -q -m "Certificate farm ${{ needs.plan.outputs.tag }}: merged summary"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((10*i))
          done
